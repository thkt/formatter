name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: clippy, rustfmt
          # Swatinem/rust-cache is configured per-job below; rustflags default
          # "-D warnings" would change build results vs the prior dtolnay action.
          cache: false
          rustflags: ""

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install nextest
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-nextest

      # oxfmt is the real formatter the binary shells out to. Without it the
      # oxfmt-path tests skip silently and the formatting contract goes
      # unexercised, so install the pinned version (renovate bumps it).
      - name: Install oxfmt
        run: npm i -g oxfmt@0.56.0

      - name: Check
        run: cargo check

      - name: Test
        run: cargo nextest run --profile ci

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format check
        run: cargo fmt -- --check
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
          rustflags: ""

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Deny check
        run: cargo deny check

      - name: Audit
        run: cargo audit

  coverage:
    # Coverage delta gate: fail when project line coverage (C0) drops vs main.
    # Measures base-vs-head total C0, not changed-lines: move-only refactors
    # relocate already-tested lines, so a changed-lines gate (diff-cover) would
    # read the added side as "new and uncovered" even though total coverage is
    # unchanged. Base-vs-head total C0 is move-immune (relocated lines cancel
    # out) while genuinely new untested code still lowers the total and fails.
    # No absolute floor, so existing unreachable code is never flagged.
    # Ported from guardrails (thkt/guardrails Issue #227); formatter is a flat
    # single-crate layout with inline #[cfg(test)] tests, so none of guardrails'
    # per-file exclusions (download.rs / tests.rs / doc_catalog) apply here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2.85.0
        with:
          tool: cargo-llvm-cov

      # The new oxfmt check/write branches only execute when oxfmt is present,
      # so without it head coverage drops below main and the gate fails on its
      # own feature. Installed once here, it covers both the head and base
      # measurements below (a global binary survives the git checkout).
      - name: Install oxfmt
        run: npm i -g oxfmt@0.56.0

      - name: Coverage delta gate (project C0 must not drop vs main)
        run: |
          set -euo pipefail
          # Sum LH (lines hit) / LF (lines found) across an lcov report -> C0 %.
          c0() { awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{ if (f==0) print "100.0"; else printf "%.4f", h*100/f }' "$1"; }
          # HEAD = PR merged into main (the checked-out pull_request ref).
          # cargo llvm-cov cleans stale profraw at the start of each run, so the
          # two measurements below do not mix.
          cargo llvm-cov --lcov --output-path head.info
          head_c0=$(c0 head.info)
          # BASE = main (fetch-depth:0 already has the history).
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git checkout --quiet --force origin/main
          cargo llvm-cov --lcov --output-path base.info
          base_c0=$(c0 base.info)
          # 0.1pp tolerance absorbs instrumentation rounding / total line drift.
          awk -v b="$base_c0" -v h="$head_c0" 'BEGIN {
            printf "C0 coverage: main %.2f%% -> PR %.2f%%\n", b, h
            if (h + 0.1 < b) {
              printf "::error::C0 coverage dropped %.2f%% -> %.2f%% (tolerance 0.1pp)\n", b, h
              exit 1
            }
            print "OK: coverage did not drop"
          }'
