rules:
  adhoc-packages:
    ignore:
      # oxfmt is a pinned (renovate-bumped) npm CLI the binary shells out to.
      # A package-lock.json install can't replace the global one: the coverage
      # job checks out origin/main mid-run, and a global binary survives that
      # checkout where a tracked lockfile would not.
      - ci.yml:43
      - ci.yml:131
  artipacked:
    ignore:
      # update-homebrew job requires HOMEBREW_TAP_TOKEN to be persisted for git push
      - release.yml:137
      # update-sentinels job requires SENTINELS_TOKEN to be persisted for git push
      - release.yml:205
  cache-poisoning:
    ignore:
      # Swatinem/rust-cache in build job; release workflow runs on tag push only,
      # no PR-driven cache injection path exists for poisoning to reach release artifacts
      - release.yml:50
  superfluous-actions:
    ignore:
      # softprops/action-gh-release retained for generate_release_notes feature
      # which gh CLI does not provide equivalently in a script step
      - release.yml:124
